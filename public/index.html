    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- HashRouter redirect for GitHub Pages -->
    <script type="text/javascript">
      // Redirect to HashRouter format if no hash is present
      // This ensures the app loads correctly on initial visit
      (function(l) {
        // If there's no hash in the URL, redirect to /#/
        if (!l.hash) {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname + '#/');
        }
      }(window.location))
    </script>
    <!-- End HashRouter redirect -->

    <title>Bella Vista - Restaurant Booking</title>
